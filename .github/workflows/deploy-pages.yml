name: Build 连享会 · 快讯 for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate generated sources
        run: python scripts/build_website.py --check
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
      - name: Test content and rendering rules
        env:
          TASK11_TEST_ROOT: ${{ runner.temp }}/brief-tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate rendered release
        run: |
          for issue in content/issues/*.json; do
            python scripts/validate_issue.py --input "$issue" --history-dir content/issues --wechat-dir publish/wechat --issues-dir .
          done
          python scripts/validate_site_identity.py
          python scripts/validate_navigation.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
